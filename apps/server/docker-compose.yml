version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pwsync
      POSTGRES_USER: pwsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://pwsync:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pwsync
      SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env (32+ random bytes)}
    ports:
      - "127.0.0.1:8787:8787" # bind loopback only; nginx terminates TLS in front of this

volumes:
  pgdata:
